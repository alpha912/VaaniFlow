name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    name: Build Windows Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: VaaniFlow v__VERSION__
          releaseBody: |
            ## VaaniFlow v__VERSION__

            Download the installer below and run it. You will need a
            [Sarvam AI API key](https://www.sarvam.ai/) (free tier: 1,000 credits).

            See the [changelog](https://github.com/alpha912/VaaniFlow/blob/main/CHANGELOG.md)
            for details on what changed in this release.
          releaseDraft: true
          prerelease: false
