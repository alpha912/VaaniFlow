[package]
name = "vaaniflow"
version = "0.1.0"
edition = "2021"
description = "Speak any Indian language. Flow anywhere."
license = "MIT"
authors = ["Alphin Tom <alphinctom@gmail.com>"]
repository = "https://github.com/alpha912/VaaniFlow"
homepage = "https://github.com/alpha912/VaaniFlow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core + plugins
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros"] }

# HTTP client for Sarvam API
reqwest = { version = "0.12", features = ["multipart", "json"] }

# Audio capture
cpal = "0.15"

# WAV encoding
hound = "3.5"

# Config persistence
dirs = "5"

# Cross-platform input event monitoring (text-field focus detection)
rdev = "0.5"

# Logging
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "windows")'.dependencies]
# Win32 APIs for cross-process text-field focus detection
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
opt-level = "s"
